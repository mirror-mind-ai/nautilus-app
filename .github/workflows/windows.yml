# Windows: the frontend suite, the native crate's tests and a bundled NSIS build, on every push
# to main and every pull request. The POSIX-only cases of the frontend suite (permission bits,
# symlinks, lsof) skip themselves on Windows by name (src/tests/support/posix.mjs).
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: vitest + cargo test + NSIS build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      - name: Frontend tests
        run: npx vitest run

      - name: Native tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Lay out the Mirror host runtime for win-x64
        run: node scripts/mirror_host_pin.mjs materialize

      - name: Bundle the development channel (NSIS)
        run: npm run tauri:build:dev -- --bundles nsis

      # Compiling the installer proves little; running it does. Silent install, launch, close and
      # silent uninstall, as an update or a scripted install would run it.
      - name: Install, launch and uninstall the development installer
        shell: powershell
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          ./scripts/windows_install_smoke.ps1 -Installer $installer -ProductName 'Nautilus for Mirror Dev' -Identifier 'ai.mirrormind.nautilus.dev' -Version $version

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: nautilus-dev-windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
